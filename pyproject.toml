[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "builder-mcp"
version = "0.1.1"
description = "Visual page design and frontend website builder."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Albanna Software Solutions", email = "ahmedalbanna966@gmail.com" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["builder_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../albanna-ai-chat"]
addopts = "-q"
